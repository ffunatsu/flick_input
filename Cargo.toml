[package]
name = "flick_input"
version = "0.1.1"
edition = "2021"
description = "smartphone as a wireless keyboard for PC"
license = "0BSD"
repository = "https://github.com/ffunatsu/flick_input"
readme = "README.md"
keywords = ["keyboard", "flick", "mobile", "input", "remote"]
categories = ["command-line-utilities"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
local-ip-address = "0.6"
qrcode = "0.14"
enigo = "0.6.1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
